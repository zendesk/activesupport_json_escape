name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Ruby ${{ matrix.ruby }}, AS ${{ matrix.activesupport }} (${{ matrix.runs-on }}${{ matrix.disable-simd == '1' && ', scalar' || '' }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        activesupport: ["8.1.0", "8.1.1", "8.1.2", "8.1.3"]
        # Production config: arm64 with the NEON sizing path.
        runs-on: ["ubuntu-24.04-arm"]
        disable-simd: [""]
        include:
          # x86-64 has no vector path yet, so this exercises the portable
          # scalar sizing scan on a second architecture.
          - ruby: "3.4"
            activesupport: "8.1.3"
            runs-on: "ubuntu-24.04"
            disable-simd: ""
          # Force the scalar path on an arm64 host that would otherwise use
          # NEON, so the fallback branch is covered independently of the CPU.
          - ruby: "3.4"
            activesupport: "8.1.3"
            runs-on: "ubuntu-24.04-arm"
            disable-simd: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install other ActiveSupport version
        run: |
          bundle config set frozen false
          bundle install
          bundle config set frozen true
        env:
          ACTIVESUPPORT: ${{ matrix.activesupport }}
      - name: Run tests
        run: bundle exec rake compile test
        env:
          ACTIVESUPPORT: ${{ matrix.activesupport }}
          ASJE_DISABLE_SIMD: ${{ matrix.disable-simd }}

  tests_successful:
    name: Tests passing?
    needs: tests
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          if ${{ needs.tests.result == 'success' }}
          then
            echo "All tests passed"
          else
            echo "Some tests failed"
            false
          fi

  memcheck:
    name: Detect C memory leaks${{ matrix.disable-simd == '1' && ' (scalar)' || '' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Check both sizing paths: mis-sizing the result buffer would surface
        # here as an invalid write or read.
        disable-simd: ["", "1"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bundle exec rake test:valgrind
        env:
          ASJE_DISABLE_SIMD: ${{ matrix.disable-simd }}

  linting:
    name: Lint Ruby with StandardRb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake standard
