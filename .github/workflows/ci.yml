name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Test with Ruby ${{ matrix.ruby }} & AS ${{ matrix.activesupport }}
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        activesupport: ["8.1.0", "8.1.1", "8.1.2", "8.1.3"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install other ActiveSupport version
        run: |
          bundle config set frozen false
          bundle install
          bundle config set frozen true
        env:
          ACTIVESUPPORT: ${{ matrix.activesupport }}
      - name: Run tests
        run: bundle exec rake compile test
        env:
          ACTIVESUPPORT: ${{ matrix.activesupport }}

  tests_successful:
    name: Tests passing?
    needs: tests
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          if ${{ needs.tests.result == 'success' }}
          then
            echo "All tests passed"
          else
            echo "Some tests failed"
            false
          fi

  memcheck:
    name: Detect C memory leaks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bundle exec rake test:valgrind

  linting:
    name: Lint Ruby with StandardRb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard
